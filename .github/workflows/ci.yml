name: CI

on:
  push:
    branches: ["main", "opt/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Ruff 静态检查与 Pytest 单元测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 安装依赖（CPU 版 PyTorch + 科学计算与测试工具）
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy opencv-python-headless scipy scikit-image scikit-learn matplotlib pillow pyarrow pytest ruff

      - name: 运行 Ruff 静态代码检查
        run: ruff check src tests

      - name: 运行 Pytest 离线自动化测试套件
        run: pytest -v
